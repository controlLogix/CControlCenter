      NOTHING IS HIDDEN HERE. There is deliberately no inline style that hides
      #root until React mounts. design/motion.css keeps every [data-reveal]
      target fully visible until motion.js sets data-motion-ready on <html>, so
      a bundle that fails to load leaves a working page rather than a black one.
      An anti-flicker style here would take that guarantee back.
    -->

  </body>
