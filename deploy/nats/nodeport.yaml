# kind only: exposes the client port on the node, which kind.yaml maps to 127.0.0.1:4222.
# On a hosted cluster use a LoadBalancer instead (values.yaml, service.merge).
apiVersion: v1
kind: Service
metadata:
  name: nats-client-nodeport
  namespace: nats
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: nats
  ports:
    - name: nats
      port: 4222
      targetPort: 4222
      nodePort: 30422
