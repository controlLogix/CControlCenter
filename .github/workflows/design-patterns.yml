name: Design pattern governance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  design-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node .bytedesk/design-patterns/check.mjs check --root .
