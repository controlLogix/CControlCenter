[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmux-contracts"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PyNaCl==1.6.2", "jsonschema==4.26.0", "rfc8785==0.1.4"]

[tool.setuptools.packages.find]
include = ["agentmux_contracts*"]
