[project]
name = "voicecli"
version = "1.0.0"
description = "Voice to any CLI: local Whisper transcription, overlay, typed into the focused window"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
voicecli = "voicecli.cli:main"
